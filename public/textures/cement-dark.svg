<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <filter id="c" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="5" stitchTiles="stitch" result="n"/>
      <feDiffuseLighting in="n" lighting-color="#3a4558" surfaceScale="3" result="d">
        <feDistantLight azimuth="120" elevation="42"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="d" mode="multiply"/>
    </filter>
    <filter id="p" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.75  0 0 0 0 0.78  0 0 0 0 0.72  0 0 0 0.18 0"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="#1a2332" filter="url(#c)"/>
  <rect width="600" height="600" filter="url(#p)"/>
</svg>
