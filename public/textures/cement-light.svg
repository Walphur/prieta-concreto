<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <filter id="c" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="5" stitchTiles="stitch" result="n"/>
      <feDiffuseLighting in="n" lighting-color="#ebe6df" surfaceScale="2.2" result="d">
        <feDistantLight azimuth="135" elevation="48"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="d" mode="multiply"/>
    </filter>
    <filter id="p" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.7" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.52  0 0 0 0 0.48  0 0 0 0.12 0"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="#e4dfd7" filter="url(#c)"/>
  <rect width="600" height="600" filter="url(#p)"/>
</svg>
